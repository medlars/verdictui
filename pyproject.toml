# Python tooling config for the PM/scripts layer only — the product is Swift.
# No [project]/[build-system] section on purpose: this package is never pip-installed
# (ADR 2026-003 legacy-install hazard); the file exists to carry the canonical fleet
# code-quality config (shared/rules.md).

[tool.ruff]
line-length = 100
# Pinned, never inferred. Without it ruff derives the target from an installed
# environment it finds NEAR the project, so the same commit lints differently
# depending on where the checkout sits. Measured 2026-08-21: the main tree
# resolved `unresolved_target_version = none` and reported "83 files already
# formatted", while a detached worktree under /tmp resolved `3.14` and reported
# "2 files would be reformatted" — on identical bytes, identical config, with
# both caches cleared.
#
# The divergence is not cosmetic. At 3.14 ruff knows PEP 758 permits a parenless
# `except OSError, ValueError:` and PREFERS it, so it wants to strip parens the
# 3.13-and-earlier grammar requires. A CI runner or a verification worktree
# therefore fails `stage_lint` on source the developer's tree calls clean, and
# the failure names a file nobody touched — which reads as a regression rather
# than as an environment difference (`no.md` #14: suspect the apparatus).
#
# The fleet already runs Python 3.14 everywhere (shared/rules.md), so this
# states what was already true instead of changing behaviour.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
markers = [
    "quick: fast pure-python tests included in the pre-merge quick gate",
]

[tool.pyright]
typeCheckingMode = "basic"
# The PM imports pm_base via a runtime sys.path.insert that static analysis can't
# see; extraPaths gives pyright the same resolution so PmBase is a known base class.
# Relative to project root (sibling repo layout under ~/Projects).
# `Tests` is here for `pm_test_support`, which the split test files import as a
# bare module. pytest puts a test file's own directory on sys.path (rootdir
# insertion), so it resolves at RUN time; pyright has no such rule and reports a
# missing import unless told the same thing.
extraPaths = [
    "../shared-libs/pm-base",
    "../shared-libs/release-tools",
    "../shared-libs",
    "Tests",
    # `scripts` for `mutation_catalog` / `mutation_catalog_types`, which
    # `mutation-check.py` imports after a `sys.path.insert` on its own
    # directory — that directory holds hyphenated filenames, so it cannot be a
    # package, and pyright does not replicate the runtime insert.
    "scripts",
]
