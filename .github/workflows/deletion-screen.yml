# Vendored by claude-config scripts/vendor-deletion-screen.py -- do not edit here.
# Screens the deletions this pull request adds (owner rule INS-18201669): each one must
# be provably temporary/build or carry a `# DELETION-REVIEW:` comment. It catches what
# the local pre-commit screen cannot: `git commit --no-verify` and github.com edits.
# workflow_dispatch serves PRs a GITHUB_TOKEN opens: they fire no pull_request run,
# so the required check would never report and the PR would stay BLOCKED.
name: deletion-screen
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deletion-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Screen added deletions
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          python .github/deletion-screen/git-deletion-screen --range "$base..HEAD"
