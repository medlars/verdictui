name: Appearance Sweep (manual)

# CTS-EA04B049 / CIS-D1582551: the one direction of `sweep --color-schemes` that
# cannot be measured on the owner's Mac without flipping its system appearance is
# a DARK launch on a LIGHT host. Measured here (run 36986731637): no launch
# argument makes an app dark on a Light host; only the system appearance does.
# So on the Light runner the dark cell must be reported UNAVAILABLE (never a
# pass, never an app defect); then the ephemeral runner is switched to Dark and
# the forced-Aqua light launch must measure lighter than the dark one.
# Manual only: it needs a GUI session and is not a merge gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appearance:
    name: Dark and light launch on a hosted runner
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Build verdictui
        run: |
          swift build --build-system native --product verdictui
          echo "VERDICTUI_BIN=$(swift build --build-system native --show-bin-path)/verdictui" >> "$GITHUB_ENV"

      - name: Light host - the product sweep reports the dark cell unavailable
        run: |
          python3.14 scripts/appearance-sweep.py --binary "$VERDICTUI_BIN" \
            --app /System/Applications/Dictionary.app --product-sweep unavailable

      - name: Light host - a dark launch measures as unavailable (exit 2), not pass or fail
        run: |
          set +e
          python3.14 scripts/appearance-sweep.py --binary "$VERDICTUI_BIN" \
            --app /System/Applications/Dictionary.app
          code=$?
          echo "measurement exit $code (expected 2)"
          test "$code" -eq 2

      - name: Switch the ephemeral runner's system appearance to Dark
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          test "$(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')" = true

      - name: Dark host - the product sweep launches and judges the dark cell
        run: |
          python3.14 scripts/appearance-sweep.py --binary "$VERDICTUI_BIN" \
            --app /System/Applications/Dictionary.app --product-sweep realised

      - name: Dark host - forced-Aqua light launch measures lighter than dark
        run: |
          python3.14 scripts/appearance-sweep.py --binary "$VERDICTUI_BIN" \
            --app /System/Applications/Dictionary.app
