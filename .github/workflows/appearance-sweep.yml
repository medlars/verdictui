name: Appearance Sweep (manual)

# CTS-EA04B049: the one direction of `sweep --color-schemes` that cannot be
# measured on the owner's Mac without flipping its system appearance is a DARK
# launch on a LIGHT host. A hosted runner is the Light-mode host, so measure it
# there. Manual only: it needs a GUI session and is not a merge gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appearance:
    name: Dark and light launch on a hosted runner
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Build verdictui
        run: swift build --build-system native --product verdictui

      - name: Measure root background per launch appearance
        run: |
          python3.14 scripts/appearance-sweep.py \
            --binary "$(swift build --build-system native --show-bin-path)/verdictui" \
            --app /System/Applications/Calculator.app
