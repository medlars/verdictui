name: Check Pinned GitHub Actions for Updates

on:
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  check-pinned-actions:
    name: Check Pinned Actions for Updates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.2'
          check-latest: false

      - name: Check for action updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Was a ~150-line inline heredoc: unimportable, so nothing could test it,
        # and it had only THREE buckets -- missing `ahead`, so a pin NEWER than a
        # moving major tag ("v1") read as stale and the issue told the reader to
        # move a SHA pin BACKWARDS. Shared verbatim with FinanceFlow (552812f03)
        # and Archivist so the rule has ONE implementation, not three that drift.
        run: python3.14 .github/scripts/check_pinned_actions.py

      - name: Create issue for action updates
        if: steps.check.outputs.updates_found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPDATES_FILE: /tmp/updates.json
        run: node .github/scripts/create-actions-update-issue.cjs
