name: Capture CI Failures to GitHub Issue

on:
  workflow_run:
    # GitHub requires workflow_run to list the workflows it watches — a trigger
    # with no `workflows:` key is rejected by the validator as a "workflow file
    # issue" (0.0s failure). List every workflow in this repo so a failure in
    # any of them is captured. When adding a new workflow file, add its `name:`
    # here too so it stays watched (F-053: KastTune's Relay Uptime Probe failed
    # 11x with no issue filed because it was missing from a stale allow-list).
    workflows:
      - Check Pinned GitHub Actions for Updates
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  capture:
    name: Capture failure logs → GitHub Issue
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Capture CI Failures to GitHub Issue'

    steps:
      - name: Only act on same-repo runs (not forks)
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [ -n "$HEAD_REPO_FULL_NAME" ] && [ "$HEAD_REPO_FULL_NAME" != "${{ github.repository }}" ]; then
            echo "Skipping: fork PR run ($HEAD_REPO_FULL_NAME)"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      # A run can conclude 'failure' while every job in it was CANCELLED or
      # SKIPPED — that is an ABSENCE of evidence, not evidence of failure.
      # Measured: kasttune run 31120579162 concluded failure with one job
      # 'probe' at conclusion=cancelled and ZERO steps executed; it filed a P1
      # (CIS-AB3CABDF) against a subject that was verified healthy
      # (relay.kasttune.com/healthz -> 200). Step count is the discriminator
      # between "no runner ever picked this up" and "the code failed": a real
      # failure runs steps and produces a verdict.
      - name: Skip runs carrying no verdict (all jobs cancelled/skipped)
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERDICTS=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length' \
            2>/dev/null || echo "unknown")
          if [ "$VERDICTS" = "0" ]; then
            echo "Skipping: no job reached a failure verdict (all cancelled/skipped)"
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif [ "$VERDICTS" = "unknown" ]; then
            # Could not observe the jobs API. Do NOT skip on an unobserved
            # premise — fall through and let the log-based guards decide, so a
            # real failure is still captured (a check that cannot see its
            # subject must not return the success value).
            echo "Jobs API unavailable; deferring to log-based guards."
          fi

      - name: Download failing run logs
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_run fires on 'completed', but GitHub may still be
          # finalising the log archive — a single fetch then returns
          # "run <id> is still in progress; logs will be available when..."
          # and THAT text lands in the issue body as if it were the failure
          # (WatchTools#15, 2026-08-06). Retry the transient a bounded number
          # of times; every other outcome (including genuinely empty logs from
          # a cancelled job) falls through to the infra-failure guard below.
          attempts=4
          for attempt in $(seq 1 "$attempts"); do
            gh run view "${{ github.event.workflow_run.id }}" \
              --repo "${{ github.repository }}" \
              --log-failed > failure_log.txt 2>&1 || true
            if ! grep -q "is still in progress" failure_log.txt; then
              break
            fi
            # Only wait when another fetch will follow. Sleeping after the LAST
            # attempt discards a log that became ready during that wait, which
            # skips a run we could have captured.
            if [ "$attempt" -lt "$attempts" ]; then
              echo "logs not ready (attempt $attempt/$attempts) — waiting 30s"
              sleep 30
            fi
          done
          # Retries exhausted and the logs still are not available. The file now
          # holds GitHub's "still in progress" placeholder, which is NOT the
          # failure — filing it would reproduce the defect the retry exists to
          # prevent (WatchTools#15). Skip instead: a genuine failure recurs on
          # the next push, whereas a placeholder issue displaces real signal.
          if grep -q "is still in progress" failure_log.txt; then
            echo "logs never became available — skipping issue creation"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
          tail -c 6000 failure_log.txt > failure_log_tail.txt || true

      # A GitHub Actions outage fails every workflow for reasons unrelated to the
      # code: the runner cannot fetch actions, or the job is cancelled before any
      # step runs and the log is empty. Both arrive here as
      # workflow_run/completed/failure, indistinguishable from a real test
      # failure, so without this guard an outage files ci-failure issues against
      # healthy code — WatchTools#15 and kasttune#3 on 2026-08-06, and 84 bogus
      # P1s in an earlier outage. Skipping is safe: a genuine failure recurs on
      # the next push, whereas a bogus issue displaces real signal until someone
      # reads it.
      - name: Skip GitHub infrastructure failures
        if: env.SKIP != 'true'
        run: |
          set -uo pipefail
          if ! [ -s failure_log_tail.txt ]; then
            echo "Skipping: empty failure log (job cancelled before any step ran)"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Match the RUNNER SAYING it failed, not a test QUOTING the words.
          # 'Service Unavailable', 'HTTP 404' and 'failed to get run' are also
          # ordinary English inside test output: the assertion
          #   FAILED test_api.py::test_503 - assert 'Service Unavailable' == 'OK'
          # is a genuine code failure, and the old unanchored pattern skipped it --
          # making the capture unable to fail for ANY test asserting on an HTTP
          # error string. That is the fail-open direction, and it is silent: a
          # suppressed real failure produces no signal anywhere.
          # Runner diagnostics carry '##[error]' or a line-leading 'Error:'; gh
          # --log-failed prefixes every line with '<job>\t<step>\t<ts> ', so anchor
          # on that separator rather than '^'.
          if grep -qiE 'Failed to resolve action download info|(##\[error\]|[[:space:]]Error:)[[:space:]]*(Service Unavailable|failed to get run)|(##\[error\]|[[:space:]]Error:)[^|]*HTTP 404' failure_log_tail.txt; then
            echo "Skipping: GitHub infrastructure failure, not a code failure"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Failure looks code-related; continuing to file an issue."

      - name: Find existing open capture issue for this workflow
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TITLE="CI failure: ${WORKFLOW_NAME} (${HEAD_BRANCH})"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label "ci-failure" --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          echo "EXISTING_ISSUE=$EXISTING" >> "$GITHUB_ENV"
          echo "ISSUE_TITLE=$TITLE" >> "$GITHUB_ENV"

      # `gh issue create --label ci-failure` FAILS if the label does not exist,
      # and a fresh repo has no such label. Repos that already capture only work
      # because an older revision of this template created it once; dropping the
      # step made the template silently un-adoptable by any new repo, which is
      # exactly the population this rollout targets (CIS-C9E52618). --force makes
      # it idempotent where the label is already present.
      - name: Ensure ci-failure label exists
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --repo "${{ github.repository }}" \
            --color d73a4a --description "Automated: CI workflow failed on main" --force

      - name: Open or update GitHub Issue
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "**Workflow:** ${WORKFLOW_NAME}"
            echo "**Branch:** ${HEAD_BRANCH}"
            echo "**Commit:** ${HEAD_SHA}"
            echo "**Run:** ${RUN_URL}"
            echo
            echo '<details><summary>Failure log tail</summary>'
            echo
            echo '```'
            cat failure_log_tail.txt 2>/dev/null || echo "(log unavailable)"
            echo '```'
            echo '</details>'
          } > "$BODY_FILE"

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --label "ci-failure" \
              --body-file "$BODY_FILE"
          fi

  close-on-green:
    name: Close resolved ci-failure issues on success
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name != 'Capture CI Failures to GitHub Issue'
    permissions:
      # `permissions:` on a JOB REPLACES the workflow-level block, it does
      # not merge with it -- so omitting contents:read here dropped the
      # workflow-level grant and every `gh api .../commits/...` returned a
      # 403 error body instead of a SHA.
      contents: read
      actions: read
      issues: write
    steps:
      # FORK GUARD, the same one the capture job carries. Without it a
      # successful run from a FORK whose branch name COLLIDES with a real branch
      # (a fork PR from a branch literally named `main`, while "CI (main)" is
      # open here) closes THIS repo's genuine failure issue -- a fail-open that
      # silences a live failure and leaves no trace. The capture half was
      # guarded from the start; the close half never was (CTS-5CAB17DD).
      - name: Only act on same-repo runs (not forks)
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [ -n "$HEAD_REPO_FULL_NAME" ] && [ "$HEAD_REPO_FULL_NAME" != "${{ github.repository }}" ]; then
            echo "Skipping: fork PR run ($HEAD_REPO_FULL_NAME)"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Close matching open ci-failure issue for this workflow
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Match the exact title format the capture job uses:
          # "CI failure: <WorkflowName> (<branch>)"
          TITLE="CI failure: ${WORKFLOW_NAME} (${HEAD_BRANCH})"

          # Retry the lookup, and never let it fail the run. This step is
          # BOOKKEEPING for a build that already passed, so a GitHub API blip
          # must not turn a green build red — which is exactly what happened on
          # 2026-08-17: `gh issue list` got "503 Service Unavailable" during a
          # GitHub outage and, under `bash -e`, failed the whole workflow while
          # CI itself was green on the same SHA.
          #
          # Note the two failure modes are NOT the same and must not be conflated:
          # an empty result means "no issue to close" (fine), while an API error
          # means "could not look" — so the error path says so explicitly instead
          # of silently taking the nothing-to-close branch.
          ISSUE=""
          LOOKUP_OK=""
          for attempt in 1 2 3; do
            if ISSUE=$(gh issue list --repo "${{ github.repository }}" \
                --label "ci-failure" --state open \
                --search "in:title \"$TITLE\"" \
                --json number --jq '.[0].number // empty' 2>/dev/null); then
              LOOKUP_OK=1
              break
            fi
            echo "issue lookup attempt $attempt failed (transient?); retrying"
            sleep $((attempt * 5))
          done

          if [ -z "$LOOKUP_OK" ]; then
            echo "::warning::Could not query issues after 3 attempts (GitHub API unavailable)."
            echo "Skipping auto-close. This does NOT mean there was no issue to close."
            exit 0
          fi

          if [ -n "$ISSUE" ]; then
            RUN_URL="${{ github.event.workflow_run.html_url }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

            # COMMIT ORDER, not completion order (CTS-5CAB17DD). The lookup above
            # is keyed only on workflow name + branch, so ANY green run closes the
            # issue -- including an older run that was merely re-run, or one that
            # finishes after a NEWER commit has already failed and opened this
            # issue. Completion order is not commit order, and treating it as such
            # closes a ticket describing a failure that is still live.
            #
            # The cheap correct test: this run's head_sha must still be the TIP of
            # its branch. A green for a superseded commit says nothing about the
            # branch's current state.
            #
            # Fail OPEN on a lookup error, deliberately: "could not check" must not
            # become "definitely stale", or a GitHub blip stops every legitimate
            # auto-close and the issue list fills with resolved failures.
            #
            # `$(cmd || echo "")` DOES NOT yield an empty string when cmd fails. gh
            # writes its ERROR BODY to stdout, command substitution captures stdout
            # regardless of exit status, and `|| echo ""` merely appends a newline to
            # a body that is already there. TIP_SHA then held `{"message":"..."}` --
            # non-empty and unequal to HEAD_SHA -- so this guard took the never-close
            # branch on EVERY green run and rendered the error body as if it were a
            # SHA: `main is now at {"messag`. The code did the exact opposite of the
            # comment above it, on every repo in the fleet, until 2026-08-30.
            #
            # So validate the SHAPE, not mere non-emptiness: 40 hex chars is a SHA;
            # anything else is "could not observe", which must fail OPEN and SAY so.
            # Never render a value that is not SHA-shaped as though it were a SHA.
            # The question this guard must answer is "is this branch's CI green NOW?",
            # not "is this run's commit still the branch tip". Those come apart the
            # moment anything commits without running CI -- and the fleet's own
            # `evidence: run-v2` bot does exactly that after every run, pushing with
            # GITHUB_TOKEN, which by design does not trigger workflows. Measured
            # 2026-08-30: those evidence commits carry ZERO CI runs, so on every repo
            # running that bot the tip is ALWAYS ahead of any run, and a tip-equality
            # test declines forever -- silently, on every green run.
            #
            # Ask the branch's run history instead. If the newest COMPLETED run of this
            # workflow on this branch succeeded, the branch is green and this issue is
            # resolved. If it failed, a newer commit is genuinely broken and the issue
            # must stay open -- which is the case the tip check was added for
            # (CTS-5CAB17DD), and which this still covers, more directly.
            #
            # Fail OPEN when the state cannot be read: "could not check" must not become
            # "definitely stale". Validate the SHAPE of the answer -- gh writes error
            # bodies to stdout, so a bare non-empty test reads an error as a verdict.
            BRANCH_STATE=$(gh run list --repo "${{ github.repository }}" \
              --workflow "$WORKFLOW_NAME" --branch "$HEAD_BRANCH" \
              --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""' 2>&1) || true
            case "$BRANCH_STATE" in
              success)
                : ;;
              failure|cancelled|timed_out|startup_failure|action_required|neutral|stale|skipped)
                echo "::notice::Not closing #$ISSUE -- the newest completed ${WORKFLOW_NAME} run on ${HEAD_BRANCH} concluded '${BRANCH_STATE}', so the branch is not green."
                exit 0 ;;
              *)
                STATE_SNIPPET=$(printf '%s' "$BRANCH_STATE" | tr -s '[:space:]' ' ' | cut -c1-120)
                echo "::warning::Could not read the CI state of ${HEAD_BRANCH} (got: ${STATE_SNIPPET:-<empty>}). Proceeding with the close -- could-not-check must not become definitely-stale." ;;
            esac
            gh issue comment "$ISSUE" --repo "${{ github.repository }}" \
              --body "CI recovered — latest \`${WORKFLOW_NAME}\` run on \`${HEAD_BRANCH}\` (\`${HEAD_SHA:0:8}\`) is **success**. ${RUN_URL}. Auto-closing." || true
            gh issue close "$ISSUE" --repo "${{ github.repository }}" --reason completed || true
            echo "Closed issue #$ISSUE"
          else
            echo "No open ci-failure issue for \"$TITLE\" — nothing to close."
          fi
