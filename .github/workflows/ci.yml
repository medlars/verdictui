name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Swift version
        run: swift --version

      # Warnings-as-errors mirrors the PM's SWIFT_STRICT_FLAGS — keep in sync.
      - name: Build (including test targets, zero-warning)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test (zero-warning)
        run: swift test -Xswiftc -warnings-as-errors

      # DemoReportTests exercises the executable's body in-process; this catches
      # what it cannot: a process-level failure (broken @MainActor async entry,
      # stdout wiring, a crash on launch). The pipe also proves stdout is one
      # parseable JSON document. PIPESTATUS-free: pipefail makes a swift-run
      # failure fail the step even though python is last in the pipe.
      - name: Smoke-run demo executable
        run: |
          set -o pipefail
          swift run VerdictUIDemo | python3 -c "import sys, json; json.load(sys.stdin)"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists PR commits via the API; without pull-requests:read
    # that call 403s under default_workflow_permissions=read (measured PR #5).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-scripts:
    name: Lint PM scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # pm-base Requires-Python >=3.14 (fleet mandate). 3.13 fails pip install.
          python-version: "3.14"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py contracts/validate-contracts.py

      - name: Ruff (lint + format drift)
        run: |
          pip install --quiet ruff==0.15.21
          ruff check .
          ruff format --check .

      # Tests/test_verdictui_pm.py imports pm_report_helpers from pm-base, a
      # PRIVATE sibling repo no runner checks out. Without this the assertions do
      # not fail — they SKIP behind an importorskip guard, so CI stays green
      # while checking nothing (CTS-0E24FFF0).
      - name: Set up pm-base deploy key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.PM_BASE_DEPLOY_KEY }}

      # Pinned to an immutable COMMIT — never @main, never a tag: a branch moves
      # under you and a tag can be re-pointed, so either lets two runs of
      # identical source resolve different library code (gov-v2 S11). 81fc7c2 is
      # verified to CONTAIN pm_report_helpers.py and to be reachable from
      # pm-base main; pinning and containment are separate assertions and only
      # the first fails loudly (pm-base docs/CI-DEPLOY-KEYS.md).
      - name: Install pm_base
        run: pip install "git+ssh://git@github.com/medlars/pm-base.git@81fc7c2820445edd67513da35b11d29f2ab38e99"

      - name: Python test suite (PM + kernel symbol audit)
        run: |
          pip install --quiet pytest
          python3 -m pytest Tests/ -q
