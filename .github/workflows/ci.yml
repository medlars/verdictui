name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build & Test (macOS)
    runs-on: macos-15
    # `contents: write` for the evidence-persist step below, scoped to this
    # job only. Declaring permissions is absolute -- every scope not listed
    # becomes `none` -- so this job is checked to need nothing else.
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Swift version
        run: swift --version

      # Warnings-as-errors mirrors the PM's SWIFT_STRICT_FLAGS — keep in sync.
      - name: Build (including test targets, zero-warning)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test (zero-warning)
        id: tests
        run: swift test -Xswiftc -warnings-as-errors

      # DemoReportTests exercises the executable's body in-process; this catches
      # what it cannot: a process-level failure (broken @MainActor async entry,
      # stdout wiring, a crash on launch). The pipe also proves stdout is one
      # parseable JSON document. PIPESTATUS-free: pipefail makes a swift-run
      # failure fail the step even though python is last in the pipe.
      - name: Smoke-run demo executable
        run: |
          set -o pipefail
          swift run VerdictUIDemo | python3 -c "import sys, json; json.load(sys.stdin)"

      # ── Governance V2 S20: typed run-v2 evidence ─────────────────────────
      #
      # SHADOW STAGE (S10 rollback contract): additive, non-required, decides
      # nothing. Cutting over to an authoritative consumer is later work —
      # add -> shadow -> compare -> cut over -> retire.
      # `!cancelled()`: a step with no `if:` is SKIPPED once an earlier step
      # fails, and this is the FIRST link in the evidence chain. Without it a
      # red build skips the checkout, skips the emit, and the verify step
      # (which does run on red) fails a SECOND time blaming a missing deploy
      # key that is present and healthy. Evidence that exists only when
      # everything passed cannot describe a failure. Measured 2026-08-11 on
      # financeflow-pro run 31458757494; swept fleet-wide, 24 repos affected.
      - name: Check out governance-v2
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: medlars/projects-shared
          path: .gov-v2
          ref: "69b2c65651e983ccd42f45d39564c6ff7397f772"  # projects-shared main @ 2026-08-28; pinned so this repo's CI verdict cannot change without a commit here (GOV-AUD-010)
          ssh-key: ${{ secrets.SHARED_LIBS_DEPLOY_KEY }}
        continue-on-error: true
        id: govv2

      # Runs on a RED run too (`!cancelled()`): evidence that exists only when
      # everything passed cannot describe a failure, which is when it matters.
      - name: Emit run-v2 evidence (shadow)
        if: ${{ !cancelled() && hashFiles('.gov-v2/governance-v2/scripts/emit_run_evidence.py') != '' }}
        env:
          GOV_V2: ${{ github.workspace }}/.gov-v2/governance-v2
          RUN_URL: github://${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME_STAGE: ${{ steps.tests.outcome }}
        run: |
          set -o pipefail
          python - <<'PYGEN' > /tmp/stages.json
          import json, os
          # A SKIPPED step reports outcome '' — mapped to UNKNOWN, never to a
          # pass. "Did not run" and "ran and succeeded" must not collapse.
          outcome = os.environ.get("OUTCOME_STAGE", "")
          state = {"success": "PASS", "failure": "FAIL"}.get(outcome, "UNKNOWN")
          score = {"success": 100.0, "failure": 0.0}.get(outcome)
          print(json.dumps([{
              "stage_id": "tests", "required": True, "applicable": True,
              "state": state, "score": score,
              "reason_code": "ok" if state == "PASS" else "no_evidence",
              "duration_s": 0.0,
              "evidence_refs": [{"kind": "log", "locator": os.environ["RUN_URL"]}],
              "evaluator_version": "swift-test/6.3",
          }]))
          PYGEN
          python "$GOV_V2/scripts/emit_run_evidence.py" \
            --project verdictui \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --runner-kind ci \
            --runner-identity "github-actions/run/${{ github.run_id }}" \
            --os "$RUNNER_OS" \
            --python-version "$(python -c 'import platform;print(platform.python_version())')" \
            --registry-version "projects-shared@${{ github.sha }}" \
            --stages-file /tmp/stages.json \
            --out evidence/run-v2.json

      # Deliberately NOT guarded by hashFiles — a verifier conditioned on the
      # same expression as the thing it verifies skips in exactly the case it
      # exists to catch, and is unfalsifiable for its own defect (lesson 224).
      - name: Verify run-v2 evidence was produced
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s evidence/run-v2.json ]; then
            echo "::error::evidence missing. The emit step did not run or wrote nothing."
            echo "Most likely the governance-v2 checkout failed: this repo needs a"
            echo "SHARED_LIBS_DEPLOY_KEY (read-only deploy key) on medlars/projects-shared."
            echo "A green build that ships no evidence is the false green this program removes."
            exit 1
          fi
          echo "run-v2 evidence present: $(wc -c < evidence/run-v2.json) bytes"

      - name: Upload run-v2 evidence
        if: ${{ !cancelled() && hashFiles('.gov-v2/governance-v2/scripts/emit_run_evidence.py') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-evidence
          path: evidence/run-v2.json
          if-no-files-found: error


      # THE ARTIFACT IS NOT THE TREE, and the step above only made an artifact.
      #
      # WHY THIS EXISTS: measured 2026-08-29 (CIS-2E3F801C). Thirty-four fleet
      # repositories carried every step above — emit, verify, upload — and had
      # persisted nothing, ever. None of them had drifted: the canonical template
      # ended at `upload-artifact`, so each repo copied the gap faithfully. The
      # evidence then aged past its 24h TTL by clock alone while the check marks
      # stayed green, which is exactly the false green the program removes
      # (CIS-9AE31F75, lesson 303).
      #
      # SCOPE, deliberately narrow:
      #   - `success()` only. A RED run still EMITS (absence of evidence is
      #     UNKNOWN, never PASS), but committing a failing record would refresh
      #     the freshness clock on the strength of a broken run — freshness would
      #     then certify nothing, which is worse than an honest stale FAIL.
      #   - the DEFAULT BRANCH only. A pull_request run's `github.ref` is
      #     `refs/pull/<n>/merge`, so the ref comparison excludes PR runs on its
      #     own — publishing a record whose commit_sha no consumer can resolve is
      #     worse than none. There is deliberately NO `github.event_name` clause:
      #     an earlier draft carried `event_name == 'push'`, which excluded every
      #     SCHEDULED run, so a repo with a daily suite and a quiet default branch
      #     — precisely where evidence goes stale — would have kept expiring by
      #     clock alone while its schedule stayed green (Constitution PR #67).
      #
      # NO RE-TRIGGER LOOP, and the guard is the DEFAULT TOKEN — one reason, not
      # two. GitHub creates no workflow run from an event caused by the default
      # GITHUB_TOKEN (documented, not assumed), and this step references no
      # secret, so the push is made with it.
      #
      # An earlier draft of this comment also claimed `paths-ignore` as a second
      # guard. It does not exist: these workflows do not list the evidence path,
      # and a comment describing a guard nobody built is worse than no comment
      # (Constitution PR #67). A PAT re-triggers normally and every record
      # carries a fresh run id, so a PAT would loop forever — add
      # `evidence/run-v2.json` to `paths-ignore` BEFORE swapping one in. Pinned
      # by test_the_push_carries_no_secret_so_it_cannot_retrigger_itself.
      #
      # THREE STATES, and they are the point. An absent record and a record that
      # cannot be pushed demand opposite responses (lessons 202/382):
      #   no record             -> exit 0, say so (the verify step owns that verdict)
      #   pushed                -> exit 0, PERSISTED
      #   refused by protection -> exit 0, VISIBLE SKIP naming the owner action
      #   refused otherwise     -> exit 1  (emitted, committed, and lost)
      # Every branch writes to $GITHUB_STEP_SUMMARY: a repo that silently stops
      # persisting looks identical to one with nothing to persist.
      #
      # Executed, not grepped, by scripts/test_evidence_persist_step_is_three_state.py.
      - name: Persist run-v2 evidence to the tree
        if: ${{ success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          # Discriminators arrive through `env:`, never as `${{ }}` inside the
          # shell, so the body a test executes is the body the runner executes.
          EVIDENCE_PATH: evidence/run-v2.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          # Every verdict reaches BOTH the log and the job summary. A skip that
          # only reaches the log is a skip nobody reads.
          say() {
            printf '%s\n' "$1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # An ABSENT record is not this step's verdict to make. The verify step
          # above already decided whether the absence is a missing deploy key
          # (skip) or a broken pipeline (fail); re-deciding it here would give one
          # condition two answers that can disagree.
          if [ ! -s "$EVIDENCE_PATH" ]; then
            say "### run-v2 evidence: NOT PERSISTED — no record was emitted"
            say ""
            say "\`$EVIDENCE_PATH\` is absent or empty, so there is nothing to commit."
            say "The verify step above owns that verdict; this step adds nothing."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because some repos gitignore build output under evidence/; the
          # record is the one file there that must be tracked.
          git add -f -- "$EVIDENCE_PATH"

          if git diff --cached --quiet; then
            say "### run-v2 evidence: ALREADY CURRENT — committed record is byte-identical"
            exit 0
          fi

          git commit -q \
            -m "evidence: run-v2 record for CI run ${RUN_ID}" \
            -m "Committed so the record outlives its run. An artifact expires with the run, so without this the committed evidence ages past its own TTL while CI stays green (CIS-9AE31F75, CIS-2E3F801C)."

          attempt=0
          while : ; do
            attempt=$((attempt + 1))
            if push_err=$(git push origin "HEAD:refs/heads/${TARGET_BRANCH}" 2>&1); then
              say "### run-v2 evidence: PERSISTED to \`${TARGET_BRANCH}\`"
              exit 0
            fi
            printf '%s\n' "$push_err"

            case "$push_err" in
              *GH013*|*"protected branch"*|*"Changes must be made through a pull request"*)
                # A POLICY blocker, not a broken pipeline. Failing here would
                # paint a protected repo permanently red for a condition no code
                # change can fix; passing silently would lose the record while
                # looking green. So: exit 0, loudly, naming who can open the route.
                echo "::warning::run-v2 evidence not persisted — the default branch is protected."
                say "### run-v2 evidence: NOT PERSISTED — the default branch is protected"
                say ""
                say "The remote refused the push (\`GH013\`). **This build is green and its"
                say "run-v2 record was not committed**, so anything reading this repository's"
                say "evidence is reading an older record or none."
                say ""
                say "Do NOT relax the ruleset to fix this: \`pull_request\` and"
                say "\`required_status_checks\` are the same protections"
                say "\`no_self_certification\` depends on. Opening the route is an OWNER"
                say "action — allow Actions to open pull requests"
                say "(\`actions/permissions/workflow\`) and register a token those PRs can"
                say "be created with, as \`medlars/projects-shared\` does (ADR-014, ADR-015)."
                exit 0
                ;;
            esac

            # A busy default branch is normal, not a failure: another commit
            # landed between checkout and push. Rebase onto what the remote
            # actually has and retry. FETCH_HEAD rather than a remote-tracking
            # ref, because a shallow CI checkout may not have one.
            if [ "$attempt" -ge 3 ]; then
              break
            fi
            git fetch -q origin "${TARGET_BRANCH}" && git rebase -q FETCH_HEAD || break
          done

          echo "::error::run-v2 evidence was emitted but could not be persisted."
          say "### run-v2 evidence: PERSIST FAILED"
          say ""
          say "The record was emitted and committed, but the push was refused for a"
          say "reason that is not branch protection, so the record is lost. A green"
          say "build that ships no evidence is the false green this program removes."
          exit 1
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists PR commits via the API; without pull-requests:read
    # that call 403s under default_workflow_permissions=read (measured PR #5).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-scripts:
    name: Lint PM scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # pm-base Requires-Python >=3.14 (fleet mandate). 3.13 fails pip install.
          python-version: "3.14"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py contracts/validate-contracts.py

      - name: Ruff (lint + format drift)
        run: |
          pip install --quiet ruff==0.15.21
          ruff check .
          ruff format --check .

      # Tests/test_verdictui_pm.py imports pm_report_helpers from pm-base, a
      # PRIVATE sibling repo no runner checks out. Without this the assertions do
      # not fail — they SKIP behind an importorskip guard, so CI stays green
      # while checking nothing (CTS-0E24FFF0).
      - name: Set up pm-base deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PM_BASE_DEPLOY_KEY }}

      # Pinned to an immutable COMMIT — never @main, never a tag: a branch moves
      # under you and a tag can be re-pointed, so either lets two runs of
      # identical source resolve different library code (gov-v2 S11). 81fc7c2 is
      # verified to CONTAIN pm_report_helpers.py and to be reachable from
      # pm-base main; pinning and containment are separate assertions and only
      # the first fails loudly (pm-base docs/CI-DEPLOY-KEYS.md).
      - name: Install pm_base
        run: pip install "git+ssh://git@github.com/medlars/pm-base.git@0b5b8943badd38ca5eba86cbe45d6ca44bfd8904"

      - name: Python test suite (PM + kernel symbol audit)
        run: |
          pip install --quiet pytest
          python3 -m pytest Tests/ -q
