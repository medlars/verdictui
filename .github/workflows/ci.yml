name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build & Test (macOS)
    runs-on: macos-15
    # `contents: write` for the evidence-persist step below, scoped to this
    # job only. Declaring permissions is absolute -- every scope not listed
    # becomes `none` -- so this job is checked to need nothing else.
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      # Warnings-as-errors mirrors the PM's SWIFT_STRICT_FLAGS — keep in sync.
      - name: Build (including test targets, zero-warning)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test (zero-warning)
        id: tests
        run: swift test -Xswiftc -warnings-as-errors

      # DemoReportTests exercises the executable's body in-process; this catches
      # what it cannot: a process-level failure (broken @MainActor async entry,
      # stdout wiring, a crash on launch). The pipe also proves stdout is one
      # parseable JSON document. PIPESTATUS-free: pipefail makes a swift-run
      # failure fail the step even though python is last in the pipe.
      - name: Smoke-run demo executable
        run: |
          set -o pipefail
          swift run VerdictUIDemo | python3 -c "import sys, json; json.load(sys.stdin)"

      # ── Governance V2 S20: typed run-v2 evidence ─────────────────────────
      #
      # SHADOW STAGE (S10 rollback contract): additive, non-required, decides
      # nothing. Cutting over to an authoritative consumer is later work —
      # add -> shadow -> compare -> cut over -> retire.
      # `!cancelled()`: a step with no `if:` is SKIPPED once an earlier step
      # fails, and this is the FIRST link in the evidence chain. Without it a
      # red build skips the checkout, skips the emit, and the verify step
      # (which does run on red) fails a SECOND time blaming a missing deploy
      # key that is present and healthy. Evidence that exists only when
      # everything passed cannot describe a failure. Measured 2026-08-11 on
      # financeflow-pro run 31458757494; swept fleet-wide, 24 repos affected.
      # CIS-04F12B01: runs the identity-contract harness against the workflow
      # text itself, so the verifier cannot silently weaken.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify CI evidence identity contract
        run: python "$GITHUB_WORKSPACE/scripts/test_ci_evidence_identity.py"

      - name: Check out governance-v2
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: medlars/projects-shared
          path: .gov-v2
          ref: "30aa65f762bf0198323c704629bfb8e14c96b199"  # projects-shared main @ 2026-09-11; pinned so this repo's CI verdict cannot change without a commit here (GOV-AUD-010)
          ssh-key: ${{ secrets.SHARED_LIBS_DEPLOY_KEY }}
        continue-on-error: true
        id: govv2

      # Runs on a RED run too (`!cancelled()`): evidence that exists only when
      # everything passed cannot describe a failure, which is when it matters.
      - name: Emit run-v2 evidence (shadow)
        if: ${{ !cancelled() && hashFiles('.gov-v2/governance-v2/scripts/emit_run_evidence.py') != '' }}
        id: runv2_emit
        env:
          GOV_V2: ${{ github.workspace }}/.gov-v2/governance-v2
          RUN_URL: github://${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME_STAGE: ${{ steps.tests.outcome }}
        run: |
          set -o pipefail
          python - <<'PYGEN' > /tmp/stages.json
          import json, os
          # A SKIPPED step reports outcome '' — mapped to UNKNOWN, never to a
          # pass. "Did not run" and "ran and succeeded" must not collapse.
          outcome = os.environ.get("OUTCOME_STAGE", "")
          state = {"success": "PASS", "failure": "FAIL"}.get(outcome, "UNKNOWN")
          score = {"success": 100.0, "failure": 0.0}.get(outcome)
          print(json.dumps([{
              "stage_id": "tests", "required": True, "applicable": True,
              "state": state, "score": score,
              "reason_code": "ok" if state == "PASS" else "no_evidence",
              "duration_s": 0.0,
              "evidence_refs": [{"kind": "log", "locator": os.environ["RUN_URL"]}],
              "evaluator_version": "swift-test/6.3",
          }]))
          PYGEN
          python "$GOV_V2/scripts/emit_run_evidence.py" \
            --project verdictui \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --runner-kind ci \
            --runner-identity "github-actions/run/${{ github.run_id }}" \
            --os "$RUNNER_OS" \
            --python-version "$(python -c 'import platform;print(platform.python_version())')" \
            --registry-version "projects-shared@${{ github.sha }}" \
            --stages-file /tmp/stages.json \
            --out evidence/run-v2.json

      # Deliberately NOT guarded by hashFiles — a verifier conditioned on the
      # same expression as the thing it verifies skips in exactly the case it
      # exists to catch, and is unfalsifiable for its own defect (lesson 224).
      - name: Verify run-v2 evidence was produced
        id: runv2_verify
        if: ${{ !cancelled() }}
        env:
          GOV_V2_KEY_PRESENT: ${{ steps.govv2.outcome == 'success' }}
          GOV_V2_CHECKOUT_OUTCOME: ${{ steps.govv2.outcome }}
          EVIDENCE_EMIT_OUTCOME: ${{ steps.runv2_emit.outcome }}
          EVIDENCE_EXPECTED_RUN_ID: ${{ github.run_id }}
          EVIDENCE_EXPECTED_COMMIT: ${{ github.sha }}
          EVIDENCE_EXPECTED_REPO: ${{ github.repository }}
          EVIDENCE_EXPECTED_PROJECT: verdictui
          EVIDENCE_PATH: ${{ github.workspace }}/evidence/run-v2.json
        run: |
          python - <<'PYVERIFY'
          import json
          import os
          import sys

          # CIS-04F12B01: a checked-out HISTORICAL run-v2.json is not proof that
          # THIS invocation emitted a record. Gate on the producer first, then
          # bind repo/commit/project/run identity, then -- only then -- accept.
          def fail(msg):
              print("::error::" + msg, file=sys.stderr)
              sys.exit(1)

          def note(line):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(line + "\n")

          emit_outcome = os.environ.get("EVIDENCE_EMIT_OUTCOME", "")
          if emit_outcome != "success":
              # THREE states, not two: "the governance checkout was unavailable"
              # and "the carve-out signals could not be observed" demand opposite
              # answers. A renamed checkout step id or a dropped env mapping
              # renders `steps.<id>.outcome` blank -- and a blank boolean maps to
              # a perfectly plausible 'false', which used to take the allow
              # branch. Reading the outcome is what separates the two
              # (CIS-04F12B01 security finding 4; owner decision 2026-09-12).
              key_present = os.environ.get("GOV_V2_KEY_PRESENT", "").lower()
              checkout_outcome = os.environ.get("GOV_V2_CHECKOUT_OUTCOME", "")
              if key_present not in ("true", "false"):
                  fail("GOV_V2_KEY_PRESENT is " + repr(key_present) + ", expected 'true' or 'false' -- the carve-out signal is unreadable, so no skip can be justified (CIS-04F12B01)")
              if checkout_outcome not in ("success", "failure", "cancelled", "skipped"):
                  fail("GOV_V2_CHECKOUT_OUTCOME is " + repr(checkout_outcome) + ", expected a step outcome -- a blank value means the checkout step id no longer resolves, which is a rewiring and not a keyless run (CIS-04F12B01)")
              if key_present != "true":
                  if checkout_outcome == "success":
                      fail("GOV_V2_KEY_PRESENT is 'false' while GOV_V2_CHECKOUT_OUTCOME is 'success' -- both derive from one step outcome, so this pair is unreachable and the wiring no longer reports what it claims (CIS-04F12B01)")
                  # Keyless repo: the emit step structurally cannot run. The
                  # skip is loud in the summary, never a silent PRESENT.
                  note("run-v2 evidence: produced no run-v2 evidence (governance-v2 checkout unavailable)")
                  print("run-v2 evidence: producer did not run (no governance-v2 checkout); skipping identity check")
                  sys.exit(0)
              fail(f"EVIDENCE_EMIT_OUTCOME is {emit_outcome!r}, not 'success' -- this invocation produced no record, so any evidence file present is historical and is not accepted (CIS-04F12B01)")

          expected = {
              key: os.environ.get(key, "")
              for key in (
                  "EVIDENCE_EXPECTED_RUN_ID",
                  "EVIDENCE_EXPECTED_COMMIT",
                  "EVIDENCE_EXPECTED_REPO",
                  "EVIDENCE_EXPECTED_PROJECT",
              )
          }
          for key, value in expected.items():
              if not value:
                  fail(f"{key} is blank -- identity binding has nothing to bind against (CIS-04F12B01)")

          path = os.environ["EVIDENCE_PATH"]
          try:
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
          except FileNotFoundError:
              fail(f"evidence file missing at {path} -- producer succeeded but wrote nothing (CIS-04F12B01)")
          if not text.strip():
              fail(f"evidence file at {path} is empty -- producer succeeded but wrote nothing (CIS-04F12B01)")
          try:
              record = json.loads(text)
          except json.JSONDecodeError as exc:
              fail(f"evidence at {path} is not valid JSON: {exc} (CIS-04F12B01)")
          if not isinstance(record, dict):
              fail(f"evidence at {path} is not a JSON object (CIS-04F12B01)")

          if record.get("schema_version") != "2.0.0":
              fail(f"schema_version is {record.get('schema_version')!r}, expected '2.0.0' (CIS-04F12B01)")

          for section in ("project", "source", "runner"):
              if not isinstance(record.get(section), dict):
                  fail(f"evidence section {section!r} is missing or not an object (CIS-04F12B01)")

          project = record["project"]
          source = record["source"]
          runner = record["runner"]

          if project.get("canonical_id") != expected["EVIDENCE_EXPECTED_PROJECT"]:
              fail(f"project.canonical_id is {project.get('canonical_id')!r}, expected {expected['EVIDENCE_EXPECTED_PROJECT']!r} -- evidence belongs to a different project (CIS-04F12B01)")
          if source.get("repo") != expected["EVIDENCE_EXPECTED_REPO"]:
              fail(f"source.repo is {source.get('repo')!r}, expected {expected['EVIDENCE_EXPECTED_REPO']!r} -- evidence from another repo (CIS-04F12B01)")
          if source.get("commit_sha") != expected["EVIDENCE_EXPECTED_COMMIT"]:
              fail(f"source.commit_sha is {source.get('commit_sha')!r}, expected {expected['EVIDENCE_EXPECTED_COMMIT']!r} -- evidence from an earlier commit (CIS-04F12B01)")
          if runner.get("kind") != "ci":
              fail(f"runner.kind is {runner.get('kind')!r}, expected 'ci' (CIS-04F12B01)")
          want_identity = "github-actions/run/" + expected["EVIDENCE_EXPECTED_RUN_ID"]
          if runner.get("identity") != want_identity:
              fail(f"runner.identity is {runner.get('identity')!r}, expected {want_identity!r} -- evidence was not produced by THIS invocation (CIS-04F12B01)")

          # Identity holds. The record's verdict is NOT re-graded: a valid FAIL
          # record from this run is still this run's evidence.
          note("run-v2 evidence: PRESENT -- identity bound to this invocation")
          print("run-v2 evidence identity verified: record belongs to this successful producer invocation (CIS-04F12B01)")
          PYVERIFY

      - name: Upload run-v2 evidence
        if: ${{ !cancelled() && steps.runv2_emit.outcome == 'success' && steps.runv2_verify.outcome == 'success' && hashFiles('evidence/run-v2.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-evidence
          path: evidence/run-v2.json
          if-no-files-found: error
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists PR commits via the API; without pull-requests:read
    # that call 403s under default_workflow_permissions=read (measured PR #5).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-scripts:
    name: Lint PM scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # pm-base Requires-Python >=3.14 (fleet mandate). 3.13 fails pip install.
          python-version: "3.14"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py contracts/validate-contracts.py

      - name: Ruff (lint + format drift)
        run: |
          pip install --quiet ruff==0.15.21
          ruff check .
          ruff format --check .

      # Tests/test_verdictui_pm.py imports pm_report_helpers from pm-base, a
      # PRIVATE sibling repo no runner checks out. Without this the assertions do
      # not fail — they SKIP behind an importorskip guard, so CI stays green
      # while checking nothing (CTS-0E24FFF0).
      - name: Set up pm-base deploy key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PM_BASE_DEPLOY_KEY }}

      # Pinned to an immutable COMMIT — never @main, never a tag: a branch moves
      # under you and a tag can be re-pointed, so either lets two runs of
      # identical source resolve different library code (gov-v2 S11). 81fc7c2 is
      # verified to CONTAIN pm_report_helpers.py and to be reachable from
      # pm-base main; pinning and containment are separate assertions and only
      # the first fails loudly (pm-base docs/CI-DEPLOY-KEYS.md).
      - name: Install pm_base
        run: pip install "git+ssh://git@github.com/medlars/pm-base.git@0b5b8943badd38ca5eba86cbe45d6ca44bfd8904"

      - name: Python test suite (PM + kernel symbol audit)
        run: |
          pip install --quiet pytest
          python3 -m pytest Tests/ -q
